[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "university-knowledge-agent"
version = "0.1.0"
description = "A RAG and agent system for Singapore university information."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pypdf>=5,<7",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
university-ingest = "app.ingestion.run:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]